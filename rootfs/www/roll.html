<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>tiny gate</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #fff7fb;
            font-family: monospace;
            color: #4a1f3d;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: min(520px, 92vw);
            background: #ffffff;
            border: 4px solid #ffb3dc;
            border-radius: 20px;
            padding: 28px;
            text-align: center;
            box-shadow: 0 10px 0 #ffd1ea;
        }

        h1 {
            margin: 0 0 8px 0;
        }

        .face {
            font-size: 56px;
            margin: 10px 0;
            transition: transform 0.1s;
        }

        input {
            width: 80%;
            padding: 12px;
            border: 3px solid #ffb3dc;
            border-radius: 12px;
            font: 20px monospace;
            text-align: center;
            outline: none;
        }

        button {
            margin-top: 14px;
            padding: 10px 18px;
            border: 0;
            border-radius: 10px;
            background: #ff82c8;
            color: white;
            font: 16px monospace;
            cursor: pointer;
        }

        button:hover {
            background: #ff66bb;
        }

        #msg {
            min-height: 26px;
            margin-top: 16px;
            font-weight: bold;
        }

        .bounce {
            transform: scale(1.15);
        }

        .shake {
            animation: shake 0.2s;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            50% {
                transform: translateX(4px);
            }

            75% {
                transform: translateX(-4px);
            }

            100% {
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>tiny gatekeeper</h1>
        <div id="face" class="face">ʕ•ᴥ•ʔ</div>

        <p>type the magic word:</p>
        <h2 id="target"></h2>

        <input id="word" autocomplete="off" autofocus>
        <br>
        <button onclick="check()">offer word</button>

        <div id="msg"></div>
    </div>

    <script>
        const words = [
            "banana", "strawberry", "kitten", "pancake", "marshmallow",
            "bunny", "cupcake", "rainbow", "snuggle", "pickle",
            "waffle", "blob", "muffin", "cloud", "sparkle"
        ];

        const failText = [
            "nope. the goblin tilts its head.",
            "incorrect. tiny disappointment.",
            "that word lacks charm.",
            "try again, soft human.",
            "the vibes are wrong."
        ];

        let current = "";
        const face = document.getElementById("face");
        const targetEl = document.getElementById("target");

        function newWord() {
            current = words[Math.floor(Math.random() * words.length)];
            targetEl.textContent = current;
        }

        function react(ok) {
            if (ok) {
                face.textContent = "ʕᵔᴥᵔʔ";
                face.classList.add("bounce");
                setTimeout(() => face.classList.remove("bounce"), 120);
            } else {
                face.textContent = "ʕ•̀ᴥ•́ʔ";
                face.classList.add("shake");
                setTimeout(() => face.classList.remove("shake"), 200);
                setTimeout(() => face.textContent = "ʕ•ᴥ•ʔ", 300);
            }
        }

        function check() {
            const input = document.getElementById("word");
            const msg = document.getElementById("msg");
            const value = input.value.trim().toLowerCase();

            if (value === current) {
                react(true);
                msg.textContent = "accepted... preparing something...";
                setTimeout(function () {
                    location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
                }, 900);
                return;
            }

            react(false);
            msg.textContent = failText[Math.floor(Math.random() * failText.length)];
            input.value = "";
            input.focus();
        }

        document.getElementById("word").addEventListener("keydown", function (e) {
            if (e.key === "Enter")
                check();
        });

        newWord();
    </script>
</body>

</html>
