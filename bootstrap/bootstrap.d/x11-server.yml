    checksum: 'sha256:a098c33924754ad43f981b740f6d576c70f9ed1006e12221b1845431ebce1239'
    patch-path-strip: 1

  - name: xorg-server
    subdir: sources
    version: '21.1.22'
    url: 'https://www.x.org/pub/individual/xserver/xorg-server-21.1.22.tar.xz'
    format: 'tar.xz'
    extract_path: 'xorg-server-21.1.22'
    checksum: 'sha256:1a242c8917c49ba29ccc1f6021613d8a2b9805dd0d271a66ae9d09f4b0bb06b3'
    patch-path-strip: 1

  - name: font-util
    subdir: sources
    version: '1.4.1'
    url: 'https://www.x.org/releases/individual/font/font-util-1.4.1.tar.xz'
