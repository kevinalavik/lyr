    checksum: 'sha256:5c9f64123c194b150fee89049991687386e6ff36ef2af7b80ba53efaf368cc95'
    patch-path-strip: 1

packages:
  - name: pixman
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: pixman
    pkgs_required:
      - mlibc
      - pkg-config
    tools_required:
      - lyr-gcc
      - lyr-binutils
    configure:
      - args: |
          cat > @THIS_BUILD_DIR@/lyr-cross.ini <<'EOF'
          [binaries]
          c = 'x86_64-lyr-gcc'
          ar = 'x86_64-lyr-ar'
          strip = 'x86_64-lyr-strip'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'lyr'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'

          [properties]
          sys_root = '@SYSROOT_DIR@'
          pkg_config_libdir = ['@SYSROOT_DIR@/usr/lib/pkgconfig', '@SYSROOT_DIR@/usr/share/pkgconfig']

          [built-in options]
          c_args = ['-O2', '-Wno-error', '--sysroot=@SYSROOT_DIR@']
          c_link_args = ['--sysroot=@SYSROOT_DIR@', '-L@SYSROOT_DIR@/usr/lib']
          EOF

          meson setup @THIS_BUILD_DIR@ @THIS_SOURCE_DIR@ \
            --cross-file @THIS_BUILD_DIR@/lyr-cross.ini \
            --prefix=/usr \
            --buildtype=release \
            -Dgtk=disabled \
            -Dlibpng=disabled \
            -Dopenmp=disabled \
            -Dtests=disabled
    build:
      - args:
          - 'ninja'
          - '-C'
          - '@THIS_BUILD_DIR@'
      - args:
          - 'ninja'
          - '-C'
          - '@THIS_BUILD_DIR@'
          - 'install'
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'

  - name: font-util
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: font-util
    pkgs_required:
      - mlibc
      - pkg-config
    tools_required:
      - lyr-gcc
      - lyr-binutils

    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-lyr'
          - '--prefix=/usr'

    build:
      - args:
          - 'make'
          - '-j@PARALLELISM@'
      - args:
          - 'make'
          - 'DESTDIR=@THIS_COLLECT_DIR@'
          - 'install'

  - name: xorg-server
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: xorg-server
    pkgs_required:
      - mlibc
      - pkg-config
      - pixman
      - font-util
      - libxcvt
      - xorgproto
      - xtrans
      - xkbcomp
      - xkeyboard-config
      - libxau
      - libxdmcp
      - libxcb
      - libx11
      - libxext
      - libxfont2
      - libxkbfile
      - openssl
      - zlib
    tools_required:
      - lyr-gcc
      - lyr-binutils

    configure:
      - args: |
          cat > @THIS_BUILD_DIR@/lyr-cross.ini <<'EOF'
          [binaries]
          c = 'x86_64-lyr-gcc'
          ar = 'x86_64-lyr-ar'
          strip = 'x86_64-lyr-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'lyr'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'

          [properties]
          sys_root = '@SYSROOT_DIR@'
          pkg_config_libdir = ['@SYSROOT_DIR@/usr/lib/pkgconfig', '@SYSROOT_DIR@/usr/share/pkgconfig']
          needs_exe_wrapper = true

          [built-in options]
          c_args = ['-O2', '-Wno-error', '-Wno-redundant-decls', '--sysroot=@SYSROOT_DIR@']
          c_link_args = ['--sysroot=@SYSROOT_DIR@', '-L@SYSROOT_DIR@/usr/lib']
          EOF

          meson setup @THIS_BUILD_DIR@ @THIS_SOURCE_DIR@ \
            --cross-file @THIS_BUILD_DIR@/lyr-cross.ini \
            --prefix=/usr \
            --libdir=lib \
            --buildtype=release \
            -Dxorg=false \
            -Dxvfb=true \
            -Dxnest=false \
            -Dxephyr=false \
            -Dglamor=false \
            -Dpciaccess=false \
            -Ddri1=false \
            -Ddri2=false \
            -Ddri3=false \
            -Dglx=false \
            -Dudev=false \
            -Dudev_kms=false \
            -Dsystemd_logind=false \
            -Dhal=false \
            -Dsecure-rpc=false \
            -Dsha1=libcrypto \
            -Dxkb_dir=/usr/share/X11/xkb \
            -Dxkb_bin_dir=/usr/bin \
            -Dxkb_output_dir=/var/lib/xkb

    build:
      - args:
          - 'ninja'
          - '-C'
          - '@THIS_BUILD_DIR@'
      - args:
          - 'ninja'
          - '-C'
          - '@THIS_BUILD_DIR@'
          - 'install'
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'