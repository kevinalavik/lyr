    extract_path: 'coreutils-9.11'
    checksum: 'sha256:394024eda0a5955217ceda9cd1201e65dc8fa3aa29c2951135a49521d57c3cc3'
    patch-path-strip: 1

  - name: lua
    subdir: sources
    version: '5.5.0'
    url: 'https://www.lua.org/ftp/lua-5.5.0.tar.gz'
    format: 'tar.gz'
    extract_path: 'lua-5.5.0'
    checksum: 'sha256:57ccc32bbbd005cab75bcc52444052535af691789dba2b9016d5c50640d68b3d'
    patch-path-strip: 1

  - name: less
    subdir: sources
    version: '692'
    url: 'https://ftp.sunet.se/mirror/gnu.org/gnu/less/less-692.tar.gz'
    format: 'tar.gz'
    extract_path: 'less-692'
    checksum: 'sha256:61300f603798ecf1d7786570789f0ff3f5a1acf075a6fb9f756837d166e37d14'
    patch-path-strip: 1

  - name: grep
    subdir: sources
    version: '3.12'
    url: 'https://ftp.sunet.se/mirror/gnu.org/gnu/grep/grep-3.12.tar.xz'
    format: 'tar.xz'
    extract_path: 'grep-3.12'
    checksum: 'sha256:2649b27c0e90e632eadcd757be06c6e9a4f48d941de51e7c0f83ff76408a07b9'
    patch-path-strip: 1

packages:
  - name: coreutils
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: coreutils
    pkgs_required:
      - mlibc
    tools_required:
      - lyr-gcc
      - lyr-binutils
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-lyr'
          - '--prefix=/usr'
          - '--enable-no-install-program=kill,uptime,mount,df,stat,du,locale'
          - '--enable-cross-guesses=risky'
          - '--with-included-regex'
        environ:
          CFLAGS: '-Wno-error'
          gl_cv_func_getcwd_null: 'yes'
          gl_cv_func_getcwd_abort_bug: 'no'
          gl_cv_func_getlocalename_l_unsafe: 'yes'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'DESTDIR=@THIS_COLLECT_DIR@', 'install']

  - name: lua
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: lua
    pkgs_required:
      - mlibc
    tools_required:
      - lyr-gcc
      - lyr-binutils
    configure: []
    build:
      - args:
          - 'make'
          - '-C'
          - '@THIS_SOURCE_DIR@'
          - '-j@PARALLELISM@'
          - 'generic'
          - 'CC=x86_64-lyr-gcc'
          - 'AR=x86_64-lyr-ar rcu'
          - 'RANLIB=x86_64-lyr-ranlib'
          - 'CFLAGS=-O2 -Wall -DLUA_USE_C89'
          - 'MYLIBS='

      - args:
          - 'make'
          - '-C'
          - '@THIS_SOURCE_DIR@'
          - 'install'
          - 'INSTALL_TOP=@THIS_COLLECT_DIR@/usr'

  - name: less
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: less
    pkgs_required:
      - mlibc
      - ncurses
    tools_required:
      - lyr-gcc
      - lyr-binutils
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-lyr'
          - '--prefix=/usr'
          - '--sysconfdir=/etc'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'DESTDIR=@THIS_COLLECT_DIR@', 'install']

  - name: grep
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: grep
    pkgs_required:
      - mlibc
    tools_required:
      - lyr-gcc
      - lyr-binutils
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-lyr'
          - '--prefix=/usr'
          - '--disable-nls'
          - '--disable-perl-regexp'
        environ:
          CC: 'x86_64-lyr-gcc'
          CFLAGS: '-O2 -Wno-error'
          gl_cv_func_getcwd_null: 'yes'
          gl_cv_func_getcwd_abort_bug: 'no'
          gl_cv_func_getlocalename_l_unsafe: 'yes'
          ac_cv_func_malloc_0_nonnull: 'yes'
          ac_cv_func_realloc_0_nonnull: 'yes'
    build:
      - args:
          - 'make'
          - '-j@PARALLELISM@'
          - 'SUBDIRS=lib doc src po'
      - args:
          - 'make'
          - 'DESTDIR=@THIS_COLLECT_DIR@'
          - 'SUBDIRS=lib doc src po'
          - 'install'