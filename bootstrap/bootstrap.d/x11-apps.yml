packages:
  - name: xeyes
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: xeyes
    pkgs_required:
      - mlibc
      - xorg-util-macros
      - xorgproto
      - libx11
      - libxext
      - libxrender
      - libxfixes
      - libxt
      - libxmu
      - libxi
      - libsm
      - libice
      - libxau
      - libxdmcp
      - libxcb
      - pkg-config
    tools_required:
      - lyr-gcc
      - lyr-binutils
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-lyr'
          - '--prefix=/usr'
        environ:
          CC: 'x86_64-lyr-gcc'
          CFLAGS: '-O2 -Wno-error'
          PKG_CONFIG_SYSROOT_DIR: '@SYSROOT_DIR@'
          PKG_CONFIG_LIBDIR: '@SYSROOT_DIR@/usr/lib/pkgconfig:@SYSROOT_DIR@/usr/share/pkgconfig'
          XEYES_CFLAGS: '-I@SYSROOT_DIR@/usr/include'
          XEYES_LIBS: '-lXmu -lXt -lSM -lICE -lXi -lXrender -lXfixes -lXext -lX11 -lxcb -lXau -lXdmcp'
          ac_cv_func_malloc_0_nonnull: 'yes'
          ac_cv_func_realloc_0_nonnull: 'yes'
          xorg_cv_malloc0_returns_null: 'no'
    build:
      - args:
          - 'make'
          - '-j@PARALLELISM@'
      - args:
          - 'make'
          - 'DESTDIR=@THIS_COLLECT_DIR@'
          - 'install'

  - name: xkbcomp
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: xkbcomp
    pkgs_required:
      - mlibc
      - pkg-config
      - xorg-util-macros
      - xorgproto
      - libx11
      - libxkbfile
      - libxau
      - libxdmcp
      - libxcb
      - zlib
    tools_required:
      - lyr-gcc
      - lyr-binutils

    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-lyr'
          - '--prefix=/usr'
        environ:
          CC: 'x86_64-lyr-gcc'
          CFLAGS: '-O2 -Wno-error -Wno-redundant-decls'
          LDFLAGS: '-static-libgcc'
          PKG_CONFIG_SYSROOT_DIR: '@SYSROOT_DIR@'
          PKG_CONFIG_LIBDIR: '@SYSROOT_DIR@/usr/lib/pkgconfig:@SYSROOT_DIR@/usr/share/pkgconfig'

          XKBCOMP_CFLAGS: '-I@SYSROOT_DIR@/usr/include'
          XKBCOMP_LIBS: '-Wl,--start-group -lxkbfile -lX11 -lxcb -lXau -lXdmcp -Wl,--end-group'

          ac_cv_func_malloc_0_nonnull: 'yes'
          ac_cv_func_realloc_0_nonnull: 'yes'
          xorg_cv_malloc0_returns_null: 'no'

    build:
      - args:
          - 'make'
          - '-j@PARALLELISM@'
      - args:
          - 'make'
          - 'DESTDIR=@THIS_COLLECT_DIR@'
          - 'install'

  - name: xkeyboard-config
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: xkeyboard-config
    pkgs_required:
      - mlibc
      - pkg-config
    tools_required:
      - lyr-gcc
      - lyr-binutils

    configure:
      - args:
          - 'meson'
          - 'setup'
          - '@THIS_BUILD_DIR@'
          - '@THIS_SOURCE_DIR@'
          - '--prefix=/usr'
          - '--buildtype=release'

    build:
      - args:
          - 'ninja'
          - '-C'
          - '@THIS_BUILD_DIR@'
      - args:
          - 'ninja'
          - '-C'
          - '@THIS_BUILD_DIR@'
          - 'install'
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'