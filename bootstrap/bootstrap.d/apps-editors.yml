sources:
  - name: nano
    subdir: sources
    version: '9.0'
    url: 'https://ftp.sunet.se/mirror/gnu.org/gnu/nano/nano-9.0.tar.gz'
    format: 'tar.gz'
    extract_path: 'nano-9.0'
    checksum: 'sha256:48a9cf0d021ddaf9d7b567ed30396147d4d2e3f7a32644f83257a7efead2b380'
    patch-path-strip: 1

packages:
  - name: nano
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: nano
    pkgs_required:
      - mlibc
      - ncurses
      - libiconv
      - pkg-config
    tools_required:
      - lyr-gcc
      - lyr-binutils

    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-lyr'
          - '--prefix=/usr'
          - '--sysconfdir=/etc'
          - '--disable-nls'
          - '--disable-libmagic'
          - '--disable-speller'
        environ:
          LIBS: '-liconv -lncursesw -ltinfow'
          ac_cv_func_getpwent: 'no'
          ac_cv_func_getgrent: 'no'
          PKG_CONFIG_SYSROOT_DIR: '@THIS_COLLECT_DIR@'
          PKG_CONFIG_LIBDIR: '@THIS_COLLECT_DIR@/usr/lib/pkgconfig:@THIS_COLLECT_DIR@/usr/share/pkgconfig'

    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'DESTDIR=@THIS_COLLECT_DIR@', 'install']