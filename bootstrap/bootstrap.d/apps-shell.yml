sources:
  - name: sh
    subdir: sources

packages:
  - name: sh
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: sh
    pkgs_required:
      - mlibc
    tools_required:
      - lyr-gcc
      - lyr-binutils
    build:
      - args: 'cp -a @SOURCE_ROOT@/../src/sh/. @THIS_BUILD_DIR@/'
      - args:
          - make
          - '-C'
          - '@THIS_BUILD_DIR@'
          - 'TOOLCHAIN_PREFIX=x86_64-lyr-'
      - args:
          - make
          - '-C'
          - '@THIS_BUILD_DIR@'
          - install
          - 'TOOLCHAIN_PREFIX=x86_64-lyr-'
          - 'DESTDIR=@SYSROOT_DIR@'
          - 'PREFIX=/'