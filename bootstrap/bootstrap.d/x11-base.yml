packages:
  - name: xorg-util-macros
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: xorg-util-macros
    pkgs_required: []
    tools_required: []
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--prefix=/usr'
    build:
      - args:
          - 'make'
          - '-j@PARALLELISM@'
      - args:
          - 'make'
          - 'DESTDIR=@THIS_COLLECT_DIR@'
          - 'install'

  - name: xorgproto
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: xorgproto
    pkgs_required:
      - xorg-util-macros
    tools_required: []
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--prefix=/usr'
    build:
      - args:
          - 'make'
          - '-j@PARALLELISM@'
      - args:
          - 'make'
          - 'DESTDIR=@THIS_COLLECT_DIR@'
          - 'install'

  - name: xtrans
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: xtrans
    pkgs_required:
      - xorg-util-macros
      - xorgproto
      - pkg-config
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-lyr'
          - '--prefix=/usr'
        environ:
          PKG_CONFIG_SYSROOT_DIR: '@SYSROOT_DIR@'
          PKG_CONFIG_LIBDIR: '@SYSROOT_DIR@/usr/lib/pkgconfig:@SYSROOT_DIR@/usr/share/pkgconfig'
    build:
      - args:
          - 'make'
          - '-j@PARALLELISM@'
      - args:
          - 'make'
          - 'DESTDIR=@THIS_COLLECT_DIR@'
          - 'install'

  - name: xcb-proto
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: xcb-proto
    pkgs_required:
      - xorg-util-macros
      - xorgproto
      - pkg-config
    tools_required: []
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--prefix=/usr'
    build:
      - args:
          - 'make'
          - '-j@PARALLELISM@'
      - args:
          - 'make'
          - 'DESTDIR=@THIS_COLLECT_DIR@'
          - 'install'

  - name: pthread-stubs
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: pthread-stubs
    pkgs_required:
      - mlibc
      - pkg-config
    tools_required:
      - lyr-gcc
      - lyr-binutils
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-lyr'
          - '--prefix=/usr'
        environ:
          CC: 'x86_64-lyr-gcc'
          PKG_CONFIG_SYSROOT_DIR: '@SYSROOT_DIR@'
          PKG_CONFIG_LIBDIR: '@SYSROOT_DIR@/usr/lib/pkgconfig:@SYSROOT_DIR@/usr/share/pkgconfig'
    build:
      - args:
          - 'make'
          - '-j@PARALLELISM@'
      - args:
          - 'make'
          - 'DESTDIR=@THIS_COLLECT_DIR@'
          - 'install'