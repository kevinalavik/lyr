packages:
  - name: libiconv
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: libiconv
    pkgs_required:
      - mlibc
    tools_required:
      - lyr-gcc
      - lyr-binutils

    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-lyr'
          - '--prefix=/usr'

    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'DESTDIR=@THIS_COLLECT_DIR@', 'install']

  - name: pkg-config
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: pkg-config
    pkgs_required:
      - mlibc
      - libiconv
    tools_required:
      - lyr-gcc
      - lyr-binutils

    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-lyr'
          - '--prefix=/usr'
          - '--disable-host-tool'
          - '--with-internal-glib'
        environ:
          CFLAGS: '-std=gnu99'
          LIBS: '-liconv'
          glib_cv_stack_grows: 'no'
          glib_cv_uscore: 'no'
          ac_cv_func_posix_getpwuid_r: 'yes'
          ac_cv_func_posix_getgrgid_r: 'yes'

    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'DESTDIR=@THIS_COLLECT_DIR@', 'install']

  - name: ncurses
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: ncurses
    pkgs_required:
      - mlibc
      - pkg-config
    tools_required:
      - lyr-gcc
      - lyr-binutils

    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-lyr'
          - '--prefix=/usr'
          - '--without-ada'
          - '--enable-pc-files'
          - '--with-pkg-config-libdir=/usr/lib/pkgconfig'
          - '--with-termlib'
          - '--enable-widec'
          - '--with-shared'
          - '--with-normal'
          - '--disable-stripping'
          - '--with-shlib-version=rel'

    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'DESTDIR=@THIS_COLLECT_DIR@', 'install']
      # As we build ncurses with wide character support, make some compatibility links
      - args: |
          for lib in ncurses form panel menu tinfo ; do
              rm -vf                    @THIS_COLLECT_DIR@/usr/lib/lib${lib}.so
              echo "INPUT(-l${lib}w)" > @THIS_COLLECT_DIR@/usr/lib/lib${lib}.so
              ln -sfv ${lib}w.pc        @THIS_COLLECT_DIR@/usr/lib/pkgconfig/${lib}.pc
          done
          rm -vf                     @THIS_COLLECT_DIR@/usr/lib/libcursesw.so
          echo "INPUT(-lncursesw)" > @THIS_COLLECT_DIR@/usr/lib/libcursesw.so
          ln -sfv libncurses.so      @THIS_COLLECT_DIR@/usr/lib/libcurses.so

  - name: zlib
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: zlib
    pkgs_required:
      - mlibc
    tools_required:
      - lyr-gcc
      - lyr-binutils
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--prefix=/usr'
        environ:
          CHOST: 'x86_64-lyr'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
        quiet: true
      - args: ['patchelf', '--set-soname', 'libz.so.1.3.2', '@THIS_COLLECT_DIR@/usr/lib/libz.so.1.3.2']

  - name: openssl
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: openssl
    pkgs_required:
      - mlibc
      - zlib
    tools_required:
      - lyr-gcc
      - lyr-binutils
    configure:
      - args:
          - 'perl'
          - '@THIS_SOURCE_DIR@/Configure'
          - 'lyr-x86_64'
          - '--prefix=/usr'
          - '--openssldir=/etc/ssl'
          - 'shared'
          - 'zlib'
          - 'no-tests'
          - 'no-async'
          - 'no-engine'
          - 'no-module'
          - 'no-afalgeng'
          - 'no-secure-memory'
    build:
      - args:
          - 'make'
          - '-j@PARALLELISM@'
      - args:
          - 'make'
          - 'DESTDIR=@THIS_COLLECT_DIR@'
          - 'install_sw'

  - name: freetype
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: freetype
    pkgs_required:
      - mlibc
      - zlib
      - pkg-config
    tools_required:
      - lyr-gcc
      - lyr-binutils
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-lyr'
          - '--prefix=/usr'
          - '--enable-shared'
          - '--enable-static'
          - '--without-bzip2'
          - '--without-png'
          - '--without-harfbuzz'
          - '--without-brotli'
        environ:
          CC: 'x86_64-lyr-gcc'
          CFLAGS: '-O2 -Wno-error'
          PKG_CONFIG_SYSROOT_DIR: '@SYSROOT_DIR@'
          PKG_CONFIG_LIBDIR: '@SYSROOT_DIR@/usr/lib/pkgconfig:@SYSROOT_DIR@/usr/share/pkgconfig'
          ac_cv_func_malloc_0_nonnull: 'yes'
          ac_cv_func_realloc_0_nonnull: 'yes'
    build:
      - args:
          - 'make'
          - '-j@PARALLELISM@'
      - args:
          - 'make'
          - 'DESTDIR=@THIS_COLLECT_DIR@'
          - 'install'

  - name: libevdev
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: libevdev
    pkgs_required:
      - mlibc
      - pkg-config
    tools_required:
      - lyr-gcc
      - lyr-binutils

    configure:
      - args:
          - 'meson'
          - 'setup'
          - '@THIS_BUILD_DIR@'
          - '@THIS_SOURCE_DIR@'
          - '--prefix=/usr'
          - '--buildtype=release'
          - '--default-library=static'
          - '-Dtests=disabled'
          - '-Ddocumentation=disabled'

    build:
      - args:
          - 'ninja'
          - '-C'
          - '@THIS_BUILD_DIR@'
      - args:
          - 'ninja'
          - '-C'
          - '@THIS_BUILD_DIR@'
          - 'install'
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
  - name: libgcc
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: gcc
    pkgs_required:
      - mlibc
    tools_required:
      - lyr-gcc
      - lyr-binutils

    configure:
      - args: |
          mkdir -p @THIS_BUILD_DIR@

          libgcc_a="$(x86_64-lyr-gcc -print-libgcc-file-name)"
          libgcc_dir="$(dirname "$libgcc_a")"
          test -f "$libgcc_dir/libgcc.a"
          test -f "$libgcc_dir/libgcc_eh.a" || true
          test -f "$libgcc_dir/libgcc_s.so.1" || true
    build:
      - args: |
          mkdir -p @THIS_COLLECT_DIR@/usr/lib

          libgcc_a="$(x86_64-lyr-gcc -print-libgcc-file-name)"
          libgcc_dir="$(dirname "$libgcc_a")"

          install -m 0644 "$libgcc_dir/libgcc.a" @THIS_COLLECT_DIR@/usr/lib/libgcc.a

          if [ -f "$libgcc_dir/libgcc_eh.a" ]; then
              install -m 0644 "$libgcc_dir/libgcc_eh.a" @THIS_COLLECT_DIR@/usr/lib/libgcc_eh.a
          fi

          if [ -f "$libgcc_dir/libgcc_s.so.1" ]; then
              install -m 0755 "$libgcc_dir/libgcc_s.so.1" @THIS_COLLECT_DIR@/usr/lib/libgcc_s.so.1
              ln -sf libgcc_s.so.1 @THIS_COLLECT_DIR@/usr/lib/libgcc_s.so
          fi