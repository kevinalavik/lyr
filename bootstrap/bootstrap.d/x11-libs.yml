packages:
  - name: libxau
    labels: [ x86_64 ]
    architecture: 'x86_64'
    revision: 1
    from_source: libxau
    pkgs_required:
      - mlibc
      - xorg-util-macros
      - xorgproto
      - pkg-config
    tools_required:
      - lyr-gcc
      - lyr-binutils
    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-lyr'
          - '--prefix=/usr'
          - '--enable-shared'
          - '--enable-static'
        environ:
          CC: 'x86_64-lyr-gcc'
          CFLAGS: '-O2 -Wno-error'
          PKG_CONFIG_SYSROOT_DIR: '@SYSROOT_DIR@'
          PKG_CONFIG_LIBDIR: '@SYSROOT_DIR@/usr/lib/pkgconfig:@SYSROOT_DIR@/usr/share/pkgconfig'
    build:
      - args:
          - 'make'
          - '-j@PARALLELISM@'
      - args:
          - 'make'
          - 'DESTDIR=@THIS_COLLECT_DIR@'
          - 'install'

