    configure:
      - args:
          - '@THIS_SOURCE_DIR@/configure'
          - '--host=x86_64-lyr'
          - '--prefix=/usr'
          - '--enable-shared'
          - '--enable-static'
          - '--disable-devel-docs'
        environ:
          CC: 'x86_64-lyr-gcc'
          CFLAGS: '-O2 -Wno-error'
          PKG_CONFIG_SYSROOT_DIR: '@SYSROOT_DIR@'
          PKG_CONFIG_LIBDIR: '@SYSROOT_DIR@/usr/lib/pkgconfig:@SYSROOT_DIR@/usr/share/pkgconfig'
          ac_cv_func_malloc_0_nonnull: 'yes'
          ac_cv_func_realloc_0_nonnull: 'yes'
    build:
      - args:
          - 'make'
          - '-j@PARALLELISM@'
      - args:
          - 'make'
          - 'DESTDIR=@THIS_COLLECT_DIR@'
          - 'install'
      - args: |
          sed -i 's|^Libs:.*|Libs: -L${libdir} -lxcb -lXau -lXdmcp|' \
            @THIS_COLLECT_DIR@/usr/lib/pkgconfig/xcb.pc

